name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  build-and-test:
    name: Build + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Tooling API baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify version sources agree
        run: |
          VERSION=$(cat VERSION)
          REV=$(grep -oP '(?<=<revision>)[^<]+' pom.xml)
          if [ "$VERSION" != "$REV" ]; then
            echo "VERSION ($VERSION) and pom.xml revision ($REV) disagree — run scripts/bump-version.sh" >&2
            exit 1
          fi
          scripts/bump-version.sh
          git diff --exit-code

      - name: Install native webview deps (Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build native webview shell
        run: scripts/build-webview.sh

      - name: Test + package (the golden/integration scripts need the CLI jar)
        run: mvn clean package

      - name: Golden tests (jvm + native)
        run: tests/run-golden.sh

      - name: Integration tests (CLI + serve)
        run: tests/run-integration.sh

  multiplatform:
    name: kof.io multiplatform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Tooling API baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: kof.io E2E over the real filesystem
        shell: bash
        run: mvn test -pl kof-compiler -am -Dtest=IoE2ETest -Dsurefire.failIfNoSpecifiedTests=false